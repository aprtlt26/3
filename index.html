
<style>
body,html{
  margin:0;
  padding:0;
  overflow:hidden;
  background:rgb(210,209,209);
  cursor:none;
}
body{ touch-action:none; }
</style>
</head>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
<script>

let inc=0.05;
let scl=10;
let cols,rows;
let zoff=0;

let particles=[];

let flowfield;

let maxSpeed=0.8;

let audioStarted=false;

let globalReverb;

let erasePoint=null;

let halfW,halfH;

let eraseRadiusSq=50*50;

// MASTER AUDIO
let masterVolume=0.9;

let isMuted=false;

// ============================================================
// AUDIO 3D - VOICE POOL CON PANNERNODE HRTF
// ============================================================
let audioCtx = null;
let masterGainNode = null;
let dryGainNode = null;
let reverbGainNode = null;
let listenerRotX = 0, listenerRotY = 0;
let targetRotX = 0, targetRotY = 0;
let frameCount = 0;

// 🔊 VOICE POOL 3D
let voicePool=[];
let voiceIndex=0;
let VOICES=24;

// ============================================================
// INICIALIZAR AUDIO 3D
// ============================================================
function initSpatialAudio() {
    try {
        audioCtx = getAudioContext();
        if (!audioCtx) return;
        
        masterGainNode = audioCtx.createGain();
        masterGainNode.gain.value = 0.7;
        masterGainNode.connect(audioCtx.destination);
        
        dryGainNode = audioCtx.createGain();
        dryGainNode.gain.value = 1.0;
        dryGainNode.connect(masterGainNode);
        
        reverbGainNode = audioCtx.createGain();
        reverbGainNode.gain.value = 0.3;
        reverbGainNode.connect(masterGainNode);
        
        if (audioCtx.listener) {
            audioCtx.listener.positionX.value = 0;
            audioCtx.listener.positionY.value = 0;
            audioCtx.listener.positionZ.value = 0;
            audioCtx.listener.forwardX.value = 0;
            audioCtx.listener.forwardY.value = 0;
            audioCtx.listener.forwardZ.value = -1;
            audioCtx.listener.upX.value = 0;
            audioCtx.listener.upY.value = 1;
            audioCtx.listener.upZ.value = 0;
        }
        
        console.log('Audio 3D HRTF iniciado');
    } catch(e) {
        console.warn('Error:', e);
    }
}

// ============================================================
// ACTUALIZAR LISTENER CON ORIENTACIÓN
// ============================================================
function updateListenerOrientation(mx, my) {
    if (!audioCtx || !audioCtx.listener) return;
    
    targetRotY = map(mx, 0, width, -1.2, 1.2);
    targetRotX = map(my, 0, height, 0.3, -0.3);
    
    listenerRotX += (targetRotX - listenerRotX) * 0.05;
    listenerRotY += (targetRotY - listenerRotY) * 0.05;
    
    try {
        let fwdX = -Math.sin(listenerRotY);
        let fwdZ = -Math.cos(listenerRotY);
        let fwdY = Math.sin(listenerRotX) * 0.1;
        let fwdLen = Math.sqrt(fwdX*fwdX + fwdY*fwdY + fwdZ*fwdZ);
        if (fwdLen > 0) { fwdX /= fwdLen; fwdY /= fwdLen; fwdZ /= fwdLen; }
        
        let upX = Math.sin(listenerRotX) * 0.15;
        let upY = 0.9;
        let upZ = 0;
        
        audioCtx.listener.forwardX.value = fwdX;
        audioCtx.listener.forwardY.value = fwdY;
        audioCtx.listener.forwardZ.value = fwdZ;
        audioCtx.listener.upX.value = upX;
        audioCtx.listener.upY.value = upY;
        audioCtx.listener.upZ.value = upZ;
    } catch(e) {}
}

// ============================================================
// PANNER 3D PARA CADA VOZ
// ============================================================
class VoicePanner {
    constructor() {
        if (!audioCtx) return;
        
        this.pannerNode = audioCtx.createPanner();
        this.pannerNode.panningModel = 'HRTF';
        this.pannerNode.distanceModel = 'inverse';
        this.pannerNode.refDistance = 1.0;
        this.pannerNode.maxDistance = 100;
        this.pannerNode.rolloffFactor = 1.0;
        this.pannerNode.coneInnerAngle = 360;
        this.pannerNode.coneOuterAngle = 360;
        
        if (dryGainNode) this.pannerNode.connect(dryGainNode);
        if (reverbGainNode) this.pannerNode.connect(reverbGainNode);
        
        this.posX = 0;
        this.posY = 0;
        this.posZ = 0;
    }
    
    setPosition(x, y, z) {
        this.posX = x;
        this.posY = y;
        this.posZ = z;
        try {
            this.pannerNode.positionX.value = x;
            this.pannerNode.positionY.value = y;
            this.pannerNode.positionZ.value = z;
        } catch(e) {}
    }
    
    connectOscillator(osc) {
        try {
            if (osc._gainNode) {
                osc._gainNode.disconnect();
                osc._gainNode.connect(this.pannerNode);
            } else if (osc.output) {
                osc.output.disconnect();
                osc.output.connect(this.pannerNode);
            } else {
                osc.disconnect();
                osc.connect(this.pannerNode);
            }
        } catch(e) {
            try {
                osc.disconnect();
                osc.connect(this.pannerNode);
            } catch(e2) {}
        }
    }
}

function setup(){

  pixelDensity(1);

  createCanvas(windowWidth,windowHeight);

  frameRate(60);

  noiseDetail(2,0.5);

  colorMode(HSB,320,900,100,100);

  cols=floor(width/scl);

  rows=floor(height/scl);

  flowfield=new Array(cols*rows);

  halfW=width*0.5;

  halfH=height*0.5;

  // INICIAR AUDIO 3D
  initSpatialAudio();

  globalReverb=new p5.Reverb();
  globalReverb.set(1.5,4);

  // VOICE POOL 3D
  for(let i=0;i<VOICES;i++){
    let osc=new p5.Oscillator('sine');
    osc.amp(0);
    
    // Panner 3D
    let panner = new VoicePanner();
    panner.connectOscillator(osc);
    
    osc.start();
    
    voicePool.push({
      osc: osc,
      panner: panner
    });
  }

  for(let i=0;i<700;i++){
    particles.push(new Particle(i));
  }

  background(80);

  noLoop();

  initAudioUI();
}

function draw(){

  if(!audioStarted){
    background(80);
    push();
    translate(width/2,height/2);
    let pulse=sin(frameCount*0.04)*8;
    noStroke();
    fill(255,180);
    textAlign(CENTER,CENTER);
    textSize(14);
    text("click to activate sound",0,40+pulse);
    stroke(255,220);
    strokeWeight(1.5);
    line(-20+pulse*0.2,-20,-4,-4);
    line(-4,-4,-10,10);
    line(-4,-4,10,2);
    noFill();
    stroke(255,80);
    ellipse(0,0,50+pulse,50+pulse);
    pop();
    frameCount++;
    return;
  }

  frameCount++;
  
  // ACTUALIZAR LISTENER 3D
  updateListenerOrientation(mouseX, mouseY);

  background(80,80);

  let yoff=0;
  for(let y=0;y<rows;y++){
    let xoff=0;
    for(let x=0;x<cols;x++){
      let index=x+y*cols;
      let angle=noise(xoff,yoff,zoff)*TWO_PI;
      let v=p5.Vector.fromAngle(angle);
      v.setMag(0.005);
      flowfield[index]=v;
      xoff+=inc;
    }
    yoff+=inc;
  }

  for(let p of particles){
    p.follow(flowfield);
    p.update();
    p.show();
    if(erasePoint){
      let dx=erasePoint.x-p.pos.x;
      let dy=erasePoint.y-p.pos.y;
      if(dx*dx+dy*dy<eraseRadiusSq){
        p.pos.set(random(width),random(height));
        p.playOscillators();
      }
    }
  }

  zoff+=0.2;
}

function mouseMoved(){
  if(!erasePoint){
    erasePoint=createVector(mouseX,mouseY);
  }else{
    erasePoint.set(mouseX,mouseY);
  }
}

function touchMoved(){
  if(!erasePoint){
    erasePoint=createVector(mouseX,mouseY);
  }else{
    erasePoint.set(mouseX,mouseY);
  }
  return false;
}

function touchEnded(){
  erasePoint=null;
}

function mousePressed(){
  if(!audioStarted){
    userStartAudio();
    audioStarted=true;
    if(audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
    loop();
  }
}

class Particle{
  constructor(id){
    this.id = id;
    this.pos=createVector(random(width),random(height));
    this.vel=createVector(0,0);
    this.acc=createVector(0,0);
    this.maxSpeed=maxSpeed;
    this.shouldPlaySound=random(1)<0.12;
    this.soundDuration=random(0.05,0.15);
    this.nextSoundTime=millis()+random(100,500);
    
    // Profundidad para 3D
    this.depth=(Math.random()-0.5)*6;
    this.depthPhase=random(TWO_PI);
    this.idOffset = id * 0.7;
  }

  follow(vectors){
    let x=floor(this.pos.x/scl);
    let y=floor(this.pos.y/scl);
    let index=x+y*cols;
    if(vectors[index]){
      this.acc.add(vectors[index]);
    }
  }

  update(){
    this.vel.add(this.acc);
    this.vel.limit(this.maxSpeed);
    this.pos.add(this.vel);
    this.acc.mult(0);

    if(this.pos.x>width) this.pos.x=0;
    if(this.pos.x<0) this.pos.x=width;
    if(this.pos.y>height) this.pos.y=0;
    if(this.pos.y<0) this.pos.y=height;

    // Profundidad con movimiento lento
    let slowWave = Math.sin(frameCount * 0.0006 + this.depthPhase) * 0.8;
    let noiseDepth = (noise(this.pos.x * 0.008, this.pos.y * 0.008, this.id + frameCount * 0.0003) - 0.5) * 2;
    this.depth += (slowWave + noiseDepth - this.depth) * 0.02;
    this.depth = Math.max(-6, Math.min(6, this.depth));

    let currentTime=millis();
    if(this.shouldPlaySound && currentTime>=this.nextSoundTime){
      this.playOscillators();
      this.nextSoundTime=currentTime+random(100,2500);
    }
  }

  playOscillators(){
    let voice=voicePool[voiceIndex];
    voiceIndex=(voiceIndex+1)%VOICES;
    
    if(!voice) return;

    let osc = voice.osc;
    let panner = voice.panner;

    let frequencyMod= map(this.pos.y,0,height,300,8000);
    let amplitudeMod= map(this.pos.x,0,width,0,1) * masterVolume;
    
    if(isMuted){
      amplitudeMod=0;
    }

    // ACTUALIZAR POSICIÓN 3D
    let x3d = map(this.pos.x, 0, width, -10, 10);
    let y3d = map(this.pos.y, 0, height, 7, -7);
    let z3d = this.depth;
    
    if(panner){
      panner.setPosition(x3d, y3d, z3d);
    }

    osc.freq(frequencyMod);
    osc.amp(amplitudeMod, 0.01);

    setTimeout(()=>{
      osc.amp(0, 0.08);
    }, this.soundDuration * 120);
  }

  show(){
    let hueValue= map(sin(frameCount*0.090+this.pos.x*0.001), -1,1,280,360);
    let saturationValue= map(this.pos.y,0,height,50,100);
    let brightnessValue= map(sin(frameCount*0.03+this.pos.y*0.01), -1,1,70,100);
    let dx=this.pos.x-halfW;
    let dy=this.pos.y-halfH;
    let distCenter=sqrt(dx*dx+dy*dy);
    let alphaValue= map(distCenter,0,halfW,255,100);

    fill(hueValue, saturationValue, brightnessValue, alphaValue);
    stroke(192,192,192,alphaValue);
    strokeWeight(1);

    beginShape();
    let numPoints=floor(random(3,8));
    for(let i=0;i<numPoints;i++){
      let offsetX=random(-1,15);
      let offsetY=random(-15,1);
      curveVertex(this.pos.x+offsetX, this.pos.y+offsetY);
    }
    endShape(CLOSE);
  }
}

// AUDIO UI
function initAudioUI(){
  const ui=document.createElement('div');
  ui.id='audioUI';
  ui.innerHTML=`
    <button id="muteBtn">M</button>
    <input type="range" id="masterSlider" min="0" max="2" step="0.01" value="0.9">
    <div id="binauralInfo" style="width:18px;height:18px;color:rgba(255,255,255,0.6);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.2);border-radius:50%;">🎧</div>
  `;
  document.body.appendChild(ui);

  const style=document.createElement('style');
  style.innerHTML=`
    #audioUI{
      position:fixed;
      bottom:20px;
      right:20px;
      z-index:999999;
      display:flex;
      align-items:center;
      gap:8px;
      background:rgba(0,0,0,0.15);
      backdrop-filter:blur(4px);
      padding:8px 10px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.1);
    }
    #masterSlider{
      width:120px;
      height:2px;
      appearance:none;
      background:#aaa;
      outline:none;
    }
    #masterSlider::-webkit-slider-thumb{
      appearance:none;
      width:12px;
      height:12px;
      border-radius:50%;
      background:white;
      cursor:pointer;
    }
    #muteBtn{
      width:22px;
      height:22px;
      border:none;
      border-radius:50%;
      background:#111;
      color:white;
      font-size:10px;
      cursor:pointer;
    }
    #binauralInfo:hover{
      background:rgba(255,255,255,0.1);
    }
  `;
  document.head.appendChild(style);

  const slider= document.getElementById('masterSlider');
  const muteBtn= document.getElementById('muteBtn');
  const infoBtn= document.getElementById('binauralInfo');

  slider.addEventListener('input',e=>{
    masterVolume=parseFloat(e.target.value);
  });

  muteBtn.addEventListener('click',()=>{
    isMuted=!isMuted;
    if(isMuted){
      muteBtn.innerHTML='X';
      for(let v of voicePool){
        v.osc.amp(0,0.05);
      }
    }else{
      muteBtn.innerHTML='M';
    }
  });

  infoBtn.addEventListener('click',()=>{
    const overlay=document.getElementById('binauralOverlay');
    if(overlay) overlay.classList.add('active');
  });

  // VENTANA EMERGENTE BINAURAL
  const overlay=document.createElement('div');
  overlay.id='binauralOverlay';
  overlay.innerHTML=`
    <div class="binaural-modal">
      <div class="icon">🎧</div>
      <h2>◈ escucha binaural 3D</h2>
      <p>Este sistema utiliza <strong>HRTF</strong> para simular cómo el oído humano percibe el sonido en el espacio tridimensional.</p>
      <div class="features">
        <span>🎧 audio 3D</span>
        <span>↗ HRTF</span>
        <span>⟳ doppler</span>
        <span>↕ elevación</span>
        <span>◈ profundidad</span>
      </div>
      <button class="close-btn" id="closeBinaural">⟡ entender</button>
    </div>
  `;
  document.body.appendChild(overlay);

  const overlayStyle=document.createElement('style');
  overlayStyle.innerHTML=`
    #binauralOverlay{
      position:fixed;
      top:0;left:0;
      width:100%;height:100%;
      background:rgba(0,0,0,0.7);
      backdrop-filter:blur(8px);
      z-index:1000000;
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      pointer-events:none;
      transition:opacity 0.5s ease;
    }
    #binauralOverlay.active{
      opacity:1;
      pointer-events:all;
    }
    #binauralOverlay .binaural-modal{
      background:rgba(15,15,20,0.9);
      backdrop-filter:blur(20px);
      border-radius:24px;
      padding:40px 50px;
      max-width:480px;
      width:90%;
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 30px 80px rgba(0,0,0,0.8);
      font-family:sans-serif;
      text-align:center;
      transform:scale(0.95);
      transition:transform 0.4s ease;
      color:white;
    }
    #binauralOverlay.active .binaural-modal{
      transform:scale(1);
    }
    #binauralOverlay .binaural-modal .icon{
      font-size:48px;
      margin-bottom:12px;
    }
    #binauralOverlay .binaural-modal h2{
      font-size:18px;
      letter-spacing:2px;
      color:rgba(200,220,100,0.9);
      text-transform:uppercase;
      margin-bottom:12px;
      font-weight:400;
    }
    #binauralOverlay .binaural-modal p{
      font-size:13px;
      line-height:1.6;
      color:rgba(255,255,255,0.7);
      margin-bottom:8px;
    }
    #binauralOverlay .binaural-modal .features{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:8px;
      margin:16px 0 20px;
    }
    #binauralOverlay .binaural-modal .features span{
      background:rgba(255,255,255,0.06);
      padding:4px 14px;
      border-radius:20px;
      font-size:10px;
      color:rgba(255,255,255,0.6);
      letter-spacing:1px;
      border:1px solid rgba(255,255,255,0.05);
    }
    #binauralOverlay .binaural-modal .close-btn{
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.15);
      color:rgba(255,255,255,0.8);
      padding:10px 30px;
      border-radius:30px;
      cursor:pointer;
      font-size:11px;
      letter-spacing:1.5px;
      transition:all 0.3s ease;
      margin-top:8px;
    }
    #binauralOverlay .binaural-modal .close-btn:hover{
      background:rgba(255,255,255,0.12);
      border-color:rgba(255,255,255,0.3);
    }
  `;
  document.head.appendChild(overlayStyle);

  document.getElementById('closeBinaural').addEventListener('click',()=>{
    overlay.classList.remove('active');
  });

  overlay.addEventListener('click',(e)=>{
    if(e.target===overlay) overlay.classList.remove('active');
  });
}

function windowResized(){
  resizeCanvas(windowWidth,windowHeight);
  halfW=width*0.5;
  halfH=height*0.5;
}

</script>
